# Stage 2: byte-level BPE tokenizer.
vocab_size: 8192          # 256 bytes + 7936 merges (+1 special token <|endoftext|>)
train_lines: 50000        # corpus lines used to learn merges (~20-25 min with the simple algorithm)
corpus_dir: data/processed/pretrain
output: checkpoints/tokenizer/bpe_8192.json
