# Stage 2 main run: ~5.3M params (3.2M without embeddings) on the GTX 1650 (4 GB).
# 12k steps x 64 x 128 tokens = ~98M tokens = ~1.8 passes over the 54.5M-token corpus (~40 min fp32)
# (~20 tokens per parameter, the compute-optimal ratio from the Chinchilla paper).
run_name: gpt_small
seed: 42
data_dir: data/processed/pretrain
checkpoint_dir: checkpoints/stage2
results_dir: results/stage2

model:
  vocab_size: 8193
  block_size: 128         # tweets average 27 tokens; 128 spans several tweets separated by <|endoftext|>
  d_model: 256
  n_layers: 4
  n_heads: 4
  dropout: 0.1
  bias: true

train:
  device: auto
  batch_size: 64
  max_steps: 12000
  warmup_steps: 500
  max_lr: 0.001           # small models tolerate a higher lr than GPT-2 (6e-4)
  min_lr: 0.0001          # 10% of max_lr
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  amp: false              # measured: fp16 AMP is 4.6x slower on the GTX 1650; set true on a T4
  log_interval: 100
  eval_interval: 500
  eval_iters: 50
